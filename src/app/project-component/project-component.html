<div>
  <app-hero
  badgeText ="مدونتنا"
  title ="اكتشف"
  titleHighlight ="مقالاتنا"
  titleRest =""
  description ="اكتشف الدروس والرؤى وأفضل الممارسات للتطوير الحديث"
  [showCards]="false"
  [showBtn]="false"
    />
</div>
<div class="background-black p-5 ">

  <nav class="navbar navbar-expand-lg  border-bottom-color">
    <form class="d-flex" role="search">
      <input class="form-control bg-black-400 text-netual-500 w-100 me-2" type="search" placeholder="ابحث في المقالات......" aria-label="Search"/>
    </form>
    <div class="container-fluid">
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto gap-2 mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active text-sm py-2 px-4 border  rounded-4 bg-black-400 text-white" aria-current="page">جميع المقالات</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-sm py-2 px-4 border  rounded-4 bg-black-400  text-white">اضاءة</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-sm py-2 px-4 border border-1 rounded-4 bg-black-400  text-white">بورتريه</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-sm py-2 px-4 border  rounded-4 bg-black-400  text-white">مناظر طبيعية</a>
          </li>
          <li class="nav-item">
            <a class="nav-link  text-sm py-2 px-4 border  rounded-4 bg-black-400 text-white">تقنيات</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-sm py-2 px-4 border rounded-4 bg-black-400 text-white">معدات</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container p-5">
    <div>
      <h6>عرض 28 مقالات</h6>
      <div>
        <button></button>
      </div>
    </div>
    <div class="card">
      <img [src]="" class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title">{{posts.title}}</h5>
        <p class="card-text">{{}}</p>
        <a  class="btn btn-primary">{{}}</a>
      </div>
    </div>
  </div>
</div>
